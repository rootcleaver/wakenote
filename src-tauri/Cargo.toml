[package]
name = "wakenote"
version = "0.261029.0"
edition = "2024"

[lib]
name = "wakenote"
path = "src/lib.rs"

[features]
default = []
# Bundles sherpa-onnx (onnxruntime) so Parakeet/SenseVoice run in-process with
# no external CLI. Off by default to keep plain `cargo` builds light; the
# shipped app enables it (see scripts/build.mjs). Prebuilt onnxruntime is
# downloaded at build time; switch sherpa-rs to its `static` feature to link
# statically instead.
asr-sherpa = ["dep:sherpa-rs"]

[dependencies]
tempfile = "3"
# `sys` re-exports the raw sherpa_rs_sys bindings so the streaming/online
# recognizer (Nemotron 3.5 ASR) can be driven directly — sherpa-rs only wraps
# the offline recognizer. See transcription.rs::transcribe_with_online_transducer.
sherpa-rs = { version = "0.6", optional = true, features = ["download-binaries", "sys"] }
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.16"
hound = "3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sonora = "0.2"
tauri = { version = "2.12.0", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2.8.0"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
thiserror = "2"
ureq = "2"
whisper-rs = { version = "0.16", default-features = false }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
enigo = "0.6.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
base64 = "0.22"
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

# Pin sherpa-onnx to v1.13.3, which adds multilingual Nemotron 3.5 streaming ASR
# (PR #3671: the model needs a per-stream language `prompt_index` the bundled
# 1.12.9 can't supply, so it crashes). crates.io sherpa-rs 0.6.8 still bundles
# 1.12.9, so we vendor patched copies: the `-sys` crate only retags the download
# + ships the 1.13.3 C API header; the high-level crate adds the new 1.13.3
# struct fields so its exhaustive config literals still compile.
[patch.crates-io]
sherpa-rs-sys = { path = "vendor/sherpa-rs-sys" }
sherpa-rs = { path = "vendor/sherpa-rs" }
# cpal 0.16 pins coreaudio-rs 0.13.0, whose get_device_name() never releases the
# CFString Core Audio returns, so every cpal device-name read leaked one string.
# The vendored copy is 0.13.0 with only that 0.14.2 ownership fix (and 0.14.2's
# explicit `'_` lifetimes, which keep the build warning-free) backported.
coreaudio-rs = { path = "vendor/coreaudio-rs" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = "0.10"
core-graphics = "0.25"
libc = "0.2"
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSButton", "NSColor", "NSControl", "NSEvent", "NSFont", "NSGraphics", "NSImage", "NSImageView", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSScreen", "NSTextField", "NSView", "NSWindow", "NSWorkspace"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSEnumerator", "NSError", "NSFileManager", "NSGeometry", "NSObject", "NSString", "NSURL"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEventSource", "CGRemoteOperation", "CGWindow"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "objc2", "CMSampleBuffer", "CMBlockBuffer", "objc2-core-audio-types"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "SCStream", "SCShareableContent", "block2", "dispatch2", "libc", "objc2-core-media"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }
